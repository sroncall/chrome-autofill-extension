name: release-chrome-extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run package

      - name: Resolve artifact metadata
        id: meta
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $file = "chrome-autofill-extension-v$version.zip"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "file=$file" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare Pages content
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path public -Force | Out-Null
          Copy-Item "artifacts/${{ steps.meta.outputs.file }}" "public/autofill-otp-chrome-latest.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/${{ steps.meta.outputs.file }}
            public/autofill-otp-chrome-latest.zip

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
