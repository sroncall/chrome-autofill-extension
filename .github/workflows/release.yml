name: release-chrome-extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run package

      - name: Resolve artifact metadata
        id: meta
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $file = "chrome-autofill-extension-v$version.zip"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "file=$file" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare stable release asset
        shell: pwsh
        run: |
          Copy-Item "artifacts/${{ steps.meta.outputs.file }}" "artifacts/autofill-otp-chrome-latest.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/${{ steps.meta.outputs.file }}
            artifacts/autofill-otp-chrome-latest.zip
